<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">CrossComply book and evidence bookmark</title>
  <desc id="desc">A closed navy legal reference book with a blue evidence bookmark emerging from its white page block.</desc>

  <!-- Lower cover and spine: the stable body of the closed book. -->
  <path fill="#071A33" d="M31 77 123 128c4 2 8 2 12 0l89-49v38c0 5-3 9-7 11l-86 47c-5 3-10 3-15 0l-70-38c-4-2-6-6-6-11V77Z"/>

  <!-- White page block. The right edge is intentionally a clean contour: no page arc. -->
  <path fill="#FFFFFF" d="m34 72 88 48c5 3 9 3 14 0l88-48v34c0 5-3 9-7 11l-84 46c-5 3-10 3-15 0l-68-37c-5-3-7-7-7-13V72Z"/>

  <!-- Dark lower edge keeps the page block anchored to the cover. -->
  <path fill="#071A33" d="m128 177 9 5 83-46c5-3 8-6 8-11v13c0 5-3 9-8 12l-82 45c-5 3-10 3-15 0l-3-2c-2-1-3-4-3-7v-7c0 3 2 5 4 6l3 2c1 1 3 1 4 0Z"/>

  <!-- Upper cover: a single continuous navy surface. -->
  <path fill="#0C2346" d="M35 66 123 17c5-3 9-3 14 0l87 51c5 3 5 7 0 10l-88 50c-5 3-10 3-15 0L35 81c-6-3-6-11 0-15Z"/>
  <path fill="#10284B" d="m35 66 9-5 78 44c5 3 10 3 15 0l87-49v9l-88 50c-5 3-10 3-15 0L35 81c-6-3-6-11 0-15Z"/>

  <!-- Subtle book construction seam, retained from the reference image. -->
  <path d="M35 66 128 121" fill="none" stroke="#F8FAFC" stroke-linecap="round" stroke-width="2.5"/>

  <!-- Evidence bookmark: physically inserted into the page block. -->
  <path fill="#2F6FED" d="m164 136 21-12c3-2 6 0 7 4v53l-11-7-11 14-2-1v-44l-4-7Z"/>
  <path fill="#BFD7FF" d="m165 136 21-12c2-1 4-1 5 1l-4 2-19 11-3-2Z"/>
</svg>
