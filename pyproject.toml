[project]
name = "lawagent"
version = "0.1.0"
description = "Cross-border data compliance Agentic RAG foundation for CrossComply."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "json-repair>=0.30",
  "fastapi~=0.141.0",
  "python-multipart>=0.0.9",
  "pwdlib[argon2]>=0.2",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx2>=2.0.0",
]
service = [
  "alembic>=1.13",
  "elasticsearch>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "minio>=7.2",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "pycryptodome>=3.20",
  "reportlab>=4.0",
  "SQLAlchemy>=2.0",
]
local-embeddings = [
  "sentence-transformers>=2.5",
]
docling = [
  "docling>=2.0",
  "onnxruntime>=1.18",
]
mineru = [
  "mineru[all]>=3.0",
]
parsers = [
  "docling>=2.0",
  "onnxruntime>=1.18",
  "mineru[all]>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["law_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"
